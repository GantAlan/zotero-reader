name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate PowerShell and JSON
        shell: pwsh
        run: ./tests/validate-repository.ps1

      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m compileall -q assets/package-template/scripts tests
          python -c "print('Python syntax validation passed.')"

      - name: Run mock and failure-path tests
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check whitespace errors
        shell: pwsh
        run: git diff --check
